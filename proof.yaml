# Your proof of work. Drafts ONLY use what is written here and in areas.yaml; nothing gets invented.
# Empty links show up as [ADD LINK] in drafts. Keep every line true.

name: Clever Ahonsi
brand: Closar
about: ""          # one or two plain lines about you, in your own words

business:
  links:           # the site link gets ?fix=<main problem> added automatically
    - {label: "Closar", url: "https://cleverahonsi-closar.github.io/"}
  facts:           # check them
    - "Built a ballet ticket sales engine for a ballet conservatory with n8n + Gemini"
    - "Kept on as their automation contractor: 9 systems in one month, plus a GoHighLevel intake and an email deliverability (DNS) fix"
    - "Sets up GoHighLevel, n8n, Zapier, Notion and ManyChat for clients"
    - "Built a lead finder that scans posts, scores them and drafts replies"
    - "B.Sc. Statistics, University of Benin (2019-2022)"

creator:
  links:           # landing page link
    - {label: "Closar", url: "https://cleverahonsi-closar.github.io/"}
  facts:
    - "Runs content farms: ideas, scripts and scheduled posting for several pages"
    - "Built a crosspost system: one post is rewritten by AI for each network and posted to TikTok, Instagram and YouTube automatically"
